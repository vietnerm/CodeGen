# Issue → AI tự tìm hiểu + xử lý.
#   Chức năng mới   : spec (ngữ cảnh IR + schema động) → guard bot → pipeline đầy đủ → PR "Closes #N"
#   Sửa / Lỗi       : phân tích ảnh hưởng từ IR → comment + nhãn needs-human
# Chỉ chạy với issue/comment của OWNER/MEMBER/COLLABORATOR (repo public: chặn người lạ đốt runner/chèn prompt).
# Cần bật: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: ai-issue

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  handle:
    if: >-
      (github.event_name == 'issues'
        && ((github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'ai'))
            || (github.event.action == 'labeled' && github.event.label.name == 'ai'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/ai')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GH_TOKEN: ${{ secrets.CODEGEN_BOT_TOKEN || github.token }}
      ISSUE: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEGEN_BOT_TOKEN || github.token }}

      - name: Nhãn + báo đã nhận
        run: |
          gh label create ai --color 5319e7 --description "AI xử lý issue" --force >/dev/null
          gh label create needs-human --color fbca04 --description "Cần người/agent lớn" --force >/dev/null
          gh label create ai-failed --color d73a4a --description "AI chưa xử lý được" --force >/dev/null
          gh issue comment "$ISSUE" --body "🤖 Đã nhận — đang tìm hiểu bảng/chức năng liên quan. Theo dõi: $RUN_URL"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cài thư viện
        run: pip install -r requirements.txt -r requirements-ci.txt "$(grep -i '^huggingface-hub' requirements-ai.txt)"

      - name: Cache llama-cpp-python (build portable)
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-cpp-portable-avx2-${{ hashFiles('requirements-ai.txt') }}-v1

      - name: Cài llama-cpp-python (portable, không -march=native)
        # Bản build mặc định tối ưu theo CPU của runner build → chạy trên runner khác bị "Illegal instruction".
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF"
          FORCE_CMAKE: "1"
        run: |
          mkdir -p wheels
          ls wheels/llama_cpp_python-*.whl >/dev/null 2>&1 || \
            pip wheel --no-deps --no-cache-dir -w wheels "$(grep -i '^llama-cpp-python' requirements-ai.txt)"
          pip install --no-cache-dir wheels/llama_cpp_python-*.whl

      - name: Cache model GGUF
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-1.7b-q8-gguf

      - name: Tải model (lần đầu)
        run: |
          mkdir -p models
          [ -f models/Qwen3-1.7B-Q8_0.gguf ] || hf download Qwen/Qwen3-1.7B-GGUF Qwen3-1.7B-Q8_0.gguf --local-dir models

      - name: AI tìm hiểu + xử lý issue
        id: ai
        env:
          AI_MODEL_PATH: models/Qwen3-1.7B-Q8_0.gguf
          OMP_NUM_THREADS: "4"
        run: python scripts/ai_issue.py --issue "$ISSUE"

      - name: Comment kết quả phân tích
        if: always() && steps.ai.outputs.action != ''
        run: gh issue comment "$ISSUE" --body-file out/ai/comment.md

      - name: Spec không hợp lệ / bị từ chối → báo lỗi
        if: steps.ai.outputs.action == 'reject' || (steps.ai.outputs.action == 'spec' && steps.ai.outputs.ok != 'true')
        run: exit 1

      - name: Sửa/Lỗi → cần người
        if: steps.ai.outputs.action == 'analysis'
        run: gh issue edit "$ISSUE" --add-label needs-human

      - name: Commit spec (chưa push)
        if: steps.ai.outputs.action == 'spec' && steps.ai.outputs.ok == 'true'
        env:
          FID: ${{ steps.ai.outputs.fid }}
          BRANCH: ${{ steps.ai.outputs.branch }}
        run: |
          git config user.name "codegen-bot"
          git config user.email "codegen-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add spec/
          git commit -m "spec($FID): AI tạo từ issue #$ISSUE"

      - name: Guard chế độ bot
        if: steps.ai.outputs.action == 'spec' && steps.ai.outputs.ok == 'true'
        run: GUARD_BASE=origin/${{ github.event.repository.default_branch }} python scripts/guard.py

      - name: Pipeline đầy đủ
        if: steps.ai.outputs.action == 'spec' && steps.ai.outputs.ok == 'true'
        env:
          DB_TYPE: postgresql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: app
          DB_USER: app
          DB_PASS: app
          APP_JWT_SECRET: ci-only-secret-not-for-production-0123456789
        run: bash scripts/pipeline.sh

      - name: Mở PR
        if: steps.ai.outputs.action == 'spec' && steps.ai.outputs.ok == 'true'
        env:
          FID: ${{ steps.ai.outputs.fid }}
          BRANCH: ${{ steps.ai.outputs.branch }}
        run: |
          git push -f origin "$BRANCH"
          { echo "Closes #$ISSUE"; echo; cat out/ai/comment.md | sed '$d'; echo;
            echo "✅ Đã đạt trong workflow: JSON schema động + validate, guard chế độ bot, pipeline đầy đủ"
            echo "(sinh code, build, chạy app, test HTTP trên PostgreSQL). Run: $RUN_URL"; } > pr-body.md
          URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')
          if [ -z "$URL" ]; then
            URL=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
                  --title "spec($FID): AI tạo từ issue #$ISSUE" --body-file pr-body.md)
          else
            gh pr edit "$URL" --body-file pr-body.md
          fi
          gh issue comment "$ISSUE" --body "🤖 Pipeline đạt — PR: $URL"
          gh issue edit "$ISSUE" --remove-label ai-failed || true

      - name: Báo lỗi
        if: failure()
        run: |
          gh issue comment "$ISSUE" --body "🤖 Chưa xử lý được (spec không hợp lệ hoặc pipeline/test hỏng). Log: $RUN_URL — bổ sung mô tả rồi comment \`/ai\` để chạy lại."
          gh issue edit "$ISSUE" --add-label ai-failed

      - name: Lưu kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-issue-${{ github.event.issue.number }}
          path: |
            out/ai/
            out/logs/
            spec/
          if-no-files-found: warn
