# AI nhỏ viết SPEC (không viết code): mô tả tiếng Việt → spec YAML ép đúng JSON schema
# → generator validate (sai thì đưa lỗi lại cho AI, tối đa 3 lần)
# → CHẠY TOÀN BỘ PIPELINE ngay trong job này (sinh code, guard chế độ bot, build, app, test HTTP)
# → chỉ khi đạt mới mở PR nhánh ai/<FID>-<run>.
#
# Yêu cầu 1 lần trong Settings → Actions → General → Workflow permissions:
#   bật "Allow GitHub Actions to create and approve pull requests".
# Tuỳ chọn: secret CODEGEN_BOT_TOKEN (fine-grained PAT: contents + pull-requests write) để PR
# do bot mở cũng kích hoạt workflow codegen (GITHUB_TOKEN không kích hoạt workflow khác).
name: ai-spec

on:
  workflow_dispatch:
    inputs:
      function_id:
        description: "Mã chức năng, vd ATA0_0130"
        required: true
      request:
        description: "Mô tả chức năng bằng tiếng Việt (trường, kiểu, ràng buộc, codemap, quan hệ)"
        required: true
      parent:
        description: "Chức năng cha (menu), vd ATA0_0100"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Input đi qua biến môi trường, KHÔNG chèn ${{ }} vào lệnh shell (chống chèn lệnh)
      FID: ${{ inputs.function_id }}
      REQUEST: ${{ inputs.request }}
      PARENT: ${{ inputs.parent }}
    steps:
      - name: Kiểm tra mã chức năng
        run: |
          [[ "$FID" =~ ^[A-Z]{2}[A-Z0-9]{2}_[0-9]{4}$ ]] || { echo "function_id sai định dạng: $FID"; exit 1; }
          [[ -z "$PARENT" || "$PARENT" =~ ^[A-Z]{2}[A-Z0-9]{2}_[0-9]{4}$ ]] || { echo "parent sai định dạng: $PARENT"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEGEN_BOT_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cài thư viện
        run: pip install -r requirements.txt -r requirements-ci.txt "$(grep -i '^huggingface-hub' requirements-ai.txt)"

      - name: Cài trình duyệt cho test giao diện
        run: python -m playwright install --with-deps chromium

      - name: Cache llama-cpp-python (build portable)
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-cpp-portable-avx2-${{ hashFiles('requirements-ai.txt') }}-v1

      - name: Cài llama-cpp-python (portable, không -march=native)
        # Bản build mặc định tối ưu theo CPU của runner build → chạy trên runner khác bị "Illegal instruction".
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF"
          FORCE_CMAKE: "1"
        run: |
          mkdir -p wheels
          ls wheels/llama_cpp_python-*.whl >/dev/null 2>&1 || \
            pip wheel --no-deps --no-cache-dir -w wheels "$(grep -i '^llama-cpp-python' requirements-ai.txt)"
          pip install --no-cache-dir wheels/llama_cpp_python-*.whl

      - name: Cache model GGUF
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-1.7b-q8-gguf

      - name: Tải model (lần đầu)
        run: |
          mkdir -p models
          [ -f models/Qwen3-1.7B-Q8_0.gguf ] || hf download Qwen/Qwen3-1.7B-GGUF Qwen3-1.7B-Q8_0.gguf --local-dir models

      - name: AI viết spec
        env:
          AI_MODEL_PATH: models/Qwen3-1.7B-Q8_0.gguf
          OMP_NUM_THREADS: "4"
        run: python scripts/ai_spec.py --function-id "$FID" --parent "$PARENT" --request "$REQUEST"

      - name: Tạo nhánh + commit (chưa push)
        run: |
          git config user.name "codegen-bot"
          git config user.email "codegen-bot@users.noreply.github.com"
          git checkout -b "ai/$FID-$GITHUB_RUN_ID"
          git add spec/
          git commit -m "spec($FID): AI tạo spec từ mô tả"

      - name: Guard chế độ bot (chỉ được sửa spec của chức năng)
        run: GUARD_BASE=origin/${{ github.event.repository.default_branch }} python scripts/guard.py

      - name: Pipeline đầy đủ trên spec mới
        env:
          DB_TYPE: postgresql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: app
          DB_USER: app
          DB_PASS: app
          APP_JWT_SECRET: ci-only-secret-not-for-production-0123456789
        run: bash scripts/pipeline.sh

      - name: Mở PR
        env:
          GH_TOKEN: ${{ secrets.CODEGEN_BOT_TOKEN || github.token }}
        run: |
          git push origin HEAD
          {
            echo "Spec do AI nhỏ tạo từ mô tả:"
            echo
            echo "> $REQUEST"
            echo
            echo "Đã đạt trong workflow ai-spec: JSON schema + generator validate, guard chế độ bot,"
            echo "pipeline đầy đủ trên PostgreSQL (sinh code, build, chạy app, test HTTP)."
            echo "Người duyệt kiểm tra nghiệp vụ trong spec trước khi merge."
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > pr-body.md
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --title "spec($FID): AI tạo spec" --body-file pr-body.md

      - name: Lưu spec + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-spec-${{ inputs.function_id }}
          path: |
            spec/
            out/logs/
            out/docs/
          if-no-files-found: warn
