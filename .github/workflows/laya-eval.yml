# Thử nghiệm Laya (không chặn pipeline): đo độ chính xác cho quyết định "tham chiếu" và "ý → trường"
# trên dữ liệu của repo. Chạy khi sửa bộ đáp án/script hoặc bấm tay.
name: laya-eval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/laya_eval.py
      - eval/**
      - .github/workflows/laya-eval.yml

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [multilingual, vega]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài torch CPU + laya
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt laya==0.5.0
      - name: Cache model Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-hf-${{ matrix.engine }}-0.5.0
      - name: Đo (${{ matrix.engine }})
        run: python scripts/laya_eval.py --engine ${{ matrix.engine }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laya-${{ matrix.engine }}
          path: out/laya/
