name: Run Qwen3 in Python

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt to send to Qwen3
        required: false
        default: Write a Python function that safely reads a JSON file.

permissions:
  contents: read

jobs:
  run-qwen3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-qwen3.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qwen3.txt

      - name: Download Qwen3 GGUF
        run: |
          mkdir -p models
          hf download Qwen/Qwen3-1.7B-GGUF Qwen3-1.7B-Q8_0.gguf --local-dir models

      - name: Run model
        env:
          QWEN3_MODEL_PATH: models/Qwen3-1.7B-Q8_0.gguf
          QWEN3_PROMPT: ${{ inputs.prompt }}
          OMP_NUM_THREADS: "2"
        run: python scripts/run_qwen3.py
