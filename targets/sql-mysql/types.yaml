dialect: mysql
TEXT: text
TEXT_N: "varchar({n})"
INT: int
BIGINT: bigint
DECIMAL: "decimal({p},{s})"
DATE: date
TIMESTAMP: datetime(6)
BOOL: boolean
JSON: json
NOW: CURRENT_TIMESTAMP(6)
IDENTITY: AUTO_INCREMENT
CREATE_SCHEMA: "CREATE DATABASE IF NOT EXISTS {s} CHARACTER SET utf8mb4;"
INLINE_INDEX: true
INLINE_COMMENT: true
TABLE_SUFFIX: " ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
BEGIN: "START TRANSACTION;"
COMMIT: "COMMIT;"
