module: ATA0
schema: at

function:
  id: ATA0_0120
  name: Hợp đồng bảo trì ATM
  parent: ATA0_0100
  sort: 20
  description: Hợp đồng bảo trì gắn với một thiết bị ATM.

entity:
  name: maint_contract
  label: Hợp đồng bảo trì
  pk: [contract_no]
  profiles: [tenant, owner_unit, audit, versioned]
  fields:
    - {name: contract_no, type: TEXT, length: 30, label: Số hợp đồng,
       pattern: '^HD[0-9]{6,20}$', example: HD000001, search: eq}
    - {name: device_id, type: TEXT, length: 20, label: Thiết bị, example: ATM0001, search: eq}
    - {name: vendor_name, type: TEXT, length: 200, label: Nhà cung cấp, example: Công ty Bảo trì A, search: like}
    - {name: start_date, type: DATE, label: Ngày bắt đầu, example: '2026-01-01'}
    - {name: end_date, type: DATE, label: Ngày kết thúc, example: '2026-12-31'}
    - {name: amount, type: DECIMAL, precision: 18, scale: 2, label: Giá trị, min: 0, example: 120000000}
    - {name: currency, type: TEXT, length: 3, label: Tiền tệ, codemap: CURRENCY, example: VND}
    - {name: status, type: TEXT, length: 1, label: Trạng thái, enum: [A, I],
       codemap: STATUS_AI, default: A, example: A, search: eq}

# Không FK: generator sinh kiểm tra tồn tại khi lưu + RESTRICT khi xoá thiết bị.
# lookup: đọc kèm tên thiết bị (JOIN, chỉ đọc) — API trả thêm device_name, trang hiện gợi ý chọn thiết bị.
relations:
  - {cols: [device_id], parent: ATA0_0110, on_delete: RESTRICT, lookup: [device_name]}

actions: [SEARCH, GET, CREATE, UPDATE, DELETE]

hooks:
  - {phase: VALIDATE, name: validateContractDates, actions: [CREATE, UPDATE],
     description: "end_date phải >= start_date"}

tests:
  - {name: "Ngày kết thúc trước ngày bắt đầu bị hook chặn", action: CREATE,
     patch: {contract_no: HD900001, start_date: '2026-06-01', end_date: '2026-01-01'},
     expect: {status: 400, field: end_date, code: HOOK}}
